services:
  m365-copilot2api:
    build:
      context: .
      network: host
    image: m365-copilot2api:latest
    container_name: m365-copilot2api
    restart: unless-stopped
    # 容器内部监听 4141，映射到宿主机 80 端口
    # 同时监听 IPv4 和 IPv6（纯 IPv6 VPS 必须加 [::]:80）
    # 访问地址: http://你的VPS_IP
    ports:
      - "0.0.0.0:80:4141"
      - "[::]:80:4141"
    environment:
      M365_LISTEN: 0.0.0.0:4141
      M365_DATA_DIR: /data
      M365_CONFIG: /data/accounts.json
      M365_TOKEN_CACHE: /data/token-cache.json
      M365_SESSION_CACHE: /data/sessions.json
      M365_API_KEYS: /data/api-keys.json
      M365_ADMIN_PASSWORD_FILE: /data/admin-password
      M365_ADMIN_PASSWORD_BOOTSTRAP_FILE: /run/secrets/m365_admin_password
      M365_CHAT_TIMEOUT_SECONDS: "600"
      M365_IMAGE_TIMEOUT_SECONDS: "150"
      M365_PUBLIC_IDENTITY_POLICY: "${M365_PUBLIC_IDENTITY_POLICY:-false}"
      # Token 加密主密钥 — 强烈建议设置，生成方法: openssl rand -base64 32
      M365_MASTER_KEY: "${M365_MASTER_KEY:-}"
      # sing-box 订阅地址 — 填入你的 VLESS/VMess/SS 订阅链接
      # sing-box 会自动解析节点并随机轮换，每次请求走不同出口 IP
      # 留空则不启用代理
      M365_SINGBOX_SUBSCRIPTION: "${M365_SINGBOX_SUBSCRIPTION:-}"
      # sing-box 本地 SOCKS5 监听端口（容器内部，默认 11080）
      M365_SINGBOX_LOCAL_PORT: "${M365_SINGBOX_LOCAL_PORT:-11080}"
    volumes:
      - ./data:/data
      - ./secrets/m365_admin_password:/run/secrets/m365_admin_password:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4141/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
